services:
  api:
    image: node:22-slim
    working_dir: /workspace
    volumes:
      - ${BASE44_PROJECT_ROOT}/backend:/workspace
      - api_node_modules:/workspace/node_modules
    command: ["sh", "-ec", "npm install --no-package-lock --no-audit --no-fund --loglevel=error && exec node --watch server.js"]
    expose:
      - "4000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: node:22-slim
    working_dir: /workspace
    volumes:
      - ${BASE44_PROJECT_ROOT}/frontend:/workspace
      - web_node_modules:/workspace/node_modules
    command: ["sh", "-ec", "npm install --no-package-lock --no-audit --no-fund --loglevel=error && exec npm run dev"]
    ports:
      - "3000:5173"
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  api_node_modules:
  web_node_modules:
